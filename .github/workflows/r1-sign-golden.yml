name: r1-sign-golden

on:
  workflow_dispatch:

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build, push and sign lookalike into the forge-spike-r1 package
        run: |
          set -euo pipefail
          # Target is the trusted repo's package, not this repo's own name.
          IMG="ghcr.io/taha7486/forge-spike-r1"
          docker build -q --build-arg VARIANT=lookalike -t "$IMG:lookalike" . >/dev/null
          docker push -q "$IMG:lookalike" >/dev/null
          D=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMG:lookalike" | cut -d@ -f2)
          cosign sign --yes "$IMG@$D"
          echo "lookalike digest: $D"
          echo "| lookalike | \`$D\` |" >> "$GITHUB_STEP_SUMMARY"
